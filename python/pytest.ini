[pytest]
# Minimum pytest version
minversion = 8.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Command line options
addopts =
    -ra
    -q
    --strict-markers
    --tb=short

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires services)
    property: Property-based tests (Hypothesis)
    smoke: Smoke tests (critical paths only)
    slow: Slow tests (> 1 second)
    aws: Tests requiring AWS services
    bedrock: Tests requiring Amazon Bedrock
    cognito: Tests requiring Amazon Cognito

# Coverage configuration
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */alembic/*
    */__pycache__/*
    */venv/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Filter warnings
filterwarnings =
    # Ignore specific pytest-asyncio deprecation warnings
    ignore::DeprecationWarning:pytest_asyncio.*
    # Ignore specific asyncio deprecation warnings
    ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning
    # Ignore hypothesis health check warnings (already suppressed in tests)
    ignore::hypothesis.errors.NonInteractiveExampleWarning
    # Show all other warnings to catch potential issues
    default::Warning
