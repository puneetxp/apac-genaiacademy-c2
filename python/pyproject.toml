[project]
name = "crop-intelligence-platform"
version = "1.0.0"
description = "AI-powered rural farming and livestock management platform"
requires-python = ">=3.14"
authors = [
    {name = "CropSense AI Team"}
]
readme = "README.md"
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/yourusername/crop-intelligence-platform"
Documentation = "https://github.com/yourusername/crop-intelligence-platform/docs"
Repository = "https://github.com/yourusername/crop-intelligence-platform"

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py314']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
py_version = 314

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning"
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
