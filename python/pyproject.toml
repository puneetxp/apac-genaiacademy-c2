[project]
name = "crop-intelligence-platform"
version = "1.0.0"
description = "AI-powered rural farming and livestock management platform"
requires-python = ">=3.14"
authors = [
    {name = "CropSense AI Team"}
]
readme = "README.md"
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/yourusername/crop-intelligence-platform"
Documentation = "https://github.com/yourusername/crop-intelligence-platform/docs"
Repository = "https://github.com/yourusername/crop-intelligence-platform"

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
# Generated by `php setup.php` (overwritten on every run): not linted/formatted here.
# Keep the service list in sync with database/Model/*.json (scripts/regenerate_code.sh prints a reminder).
extend-exclude = '''(^|/)(app/api/(isuper|islogin|ipublic)/|app/(models|orm)/|app/api/routers\.py|app/services/(active_role|advance_booking|ai_usage_quota|annual_strategy|breeding_record|buyer_interest|crop|crop_expense|crop_market_data|crop_milestone|crop_profitability|farm|farm_plot|fertilizer_application|historical_yield|livestock|livestock_health_record|livestock_listing|livestock_marketplace_listing|livestock_roi_prediction|livestock_transaction|market_price|marketplace_listing|msp_rate|offspring|opportunity_cost|payment_milestone|pest_disease_alert|pest_disease_data|price_prediction|push_subscription|quality_verification|role|seasonal_trend|shc_state_district_code|slusi_ingestion_run|slusi_lcc_report|slusi_microwatershed_map|soil_amendment|soil_moisture_data|soil_test|soil_test_result|supply_match|supply_request|system_setting|transport_booking|transport_provider|user|user_notification|veterinarian|weather_alert|weather_forecast)_service\.py)'''
target-version = ['py314']
include = '\.pyi?$'

[tool.isort]
profile = "black"
extend_skip_glob = ["app/api/isuper/*", "app/api/islogin/*", "app/api/ipublic/*", "app/models/*", "app/orm/*", "app/api/routers.py", "app/services/active_role_service.py", "app/services/advance_booking_service.py", "app/services/ai_usage_quota_service.py", "app/services/annual_strategy_service.py", "app/services/breeding_record_service.py", "app/services/buyer_interest_service.py", "app/services/crop_service.py", "app/services/crop_expense_service.py", "app/services/crop_market_data_service.py", "app/services/crop_milestone_service.py", "app/services/crop_profitability_service.py", "app/services/farm_service.py", "app/services/farm_plot_service.py", "app/services/fertilizer_application_service.py", "app/services/historical_yield_service.py", "app/services/livestock_service.py", "app/services/livestock_health_record_service.py", "app/services/livestock_listing_service.py", "app/services/livestock_marketplace_listing_service.py", "app/services/livestock_roi_prediction_service.py", "app/services/livestock_transaction_service.py", "app/services/market_price_service.py", "app/services/marketplace_listing_service.py", "app/services/msp_rate_service.py", "app/services/offspring_service.py", "app/services/opportunity_cost_service.py", "app/services/payment_milestone_service.py", "app/services/pest_disease_alert_service.py", "app/services/pest_disease_data_service.py", "app/services/price_prediction_service.py", "app/services/push_subscription_service.py", "app/services/quality_verification_service.py", "app/services/role_service.py", "app/services/seasonal_trend_service.py", "app/services/shc_state_district_code_service.py", "app/services/slusi_ingestion_run_service.py", "app/services/slusi_lcc_report_service.py", "app/services/slusi_microwatershed_map_service.py", "app/services/soil_amendment_service.py", "app/services/soil_moisture_data_service.py", "app/services/soil_test_service.py", "app/services/soil_test_result_service.py", "app/services/supply_match_service.py", "app/services/supply_request_service.py", "app/services/system_setting_service.py", "app/services/transport_booking_service.py", "app/services/transport_provider_service.py", "app/services/user_service.py", "app/services/user_notification_service.py", "app/services/veterinarian_service.py", "app/services/weather_alert_service.py", "app/services/weather_forecast_service.py"]
line_length = 100
py_version = 314

[tool.mypy]
python_version = "3.14"
exclude = '''(^|/)(app/api/(isuper|islogin|ipublic)/|app/(models|orm)/|app/api/routers\.py|app/services/(active_role|advance_booking|ai_usage_quota|annual_strategy|breeding_record|buyer_interest|crop|crop_expense|crop_market_data|crop_milestone|crop_profitability|farm|farm_plot|fertilizer_application|historical_yield|livestock|livestock_health_record|livestock_listing|livestock_marketplace_listing|livestock_roi_prediction|livestock_transaction|market_price|marketplace_listing|msp_rate|offspring|opportunity_cost|payment_milestone|pest_disease_alert|pest_disease_data|price_prediction|push_subscription|quality_verification|role|seasonal_trend|shc_state_district_code|slusi_ingestion_run|slusi_lcc_report|slusi_microwatershed_map|soil_amendment|soil_moisture_data|soil_test|soil_test_result|supply_match|supply_request|system_setting|transport_booking|transport_provider|user|user_notification|veterinarian|weather_alert|weather_forecast)_service\.py)'''
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning"
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
